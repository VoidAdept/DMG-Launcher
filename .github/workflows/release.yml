name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run -c Release -- --selftest
      - run: dotnet publish -c Release -p:Version=${GITHUB_REF_NAME#v} -o out
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: out/DMG-Launcher.exe
